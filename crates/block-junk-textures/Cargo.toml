[package]
name = "block-junk-textures"
version.workspace = true
edition.workspace = true

[dependencies]
# Same mlua config as block-junk-scripting so the workspace builds one Lua.
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
rayon = "1"
thiserror = "2"

# Only for the `render` feature (chunk material + atlas upload). Default
# features match the game binary so feature unification is a no-op.
bevy = { version = "0.19", optional = true }

# Only for the `egui-fonts` feature. Must track bevy_egui's egui version
# (0.40 → egui 0.34) or the Context types won't unify.
egui = { version = "0.34", default-features = false, optional = true }

[dev-dependencies]
# Only for the render_previews example (flatten textures.lua → PNGs).
png = "0.18"

[features]
default = []
render = ["dep:bevy"]
egui-fonts = ["dep:egui"]
