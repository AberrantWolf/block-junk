[package]
name = "block-junk"
version.workspace = true
edition.workspace = true

[dependencies]
# Bevy input sources are opt-in features; "default" is just 2d/3d/ui rendering.
bevy = { version = "0.19", features = ["mouse", "keyboard"] }
block-mesh = "0.2"
ndshape = "0.3"
# Features:
# - default brings client/server/replication/prediction/interpolation
# - netcode + udp wire up real network transport for split mode
# - input_native enables the per-tick PlayerInput replication pipeline
#   (sequence-numbered input replay for prediction rollback)
# - Note we do NOT enable crossbeam: solo play runs a server thread +
#   client App talking via UDP-localhost (always-client architecture).
lightyear = { version = "0.28", features = ["netcode", "udp", "input_native", "frame_interpolation"] }
avian3d = "0.7"
# bevy_egui 0.40 = egui 0.34. 0.41 (egui 0.35) is available — taking it
# is a small migration pass of its own, deferred until something needs it.
bevy_egui = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
# Both already in the tree transitively (bevy/lightyear); direct deps for
# the persistent client identity (entropy) and the dedicated server's
# Ctrl-C → quit-save path.
getrandom = "0.3"
ctrlc = "3"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }

block-junk-mod-api = { path = "../block-junk-mod-api" }
block-junk-scripting = { path = "../block-junk-scripting" }
block-junk-textures = { path = "../block-junk-textures", features = ["render", "egui-fonts"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
